<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Over 1.5 &middot; Card Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060a;
    --ink: #f2f3fb;
    --muted: #8189a3;
    --muted-2: #545a72;
    --win: #3ee89c;
    --loss: #ff5577;
    --pending: #7ab8ff;
    --gold: #ffd36b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    margin: 0; min-height: 100vh; padding: 36px 16px;
    background: var(--bg);
    color: var(--ink); font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  /* wide, not the old 460px column -- the carousel needs real room either
     side of the focused card for neighbours to peek in without clipping */
  .wrap { max-width: min(94vw, 960px); width: 100%; margin: 0 auto; }

  /* ============ CAROUSEL ============
     Every card exists in the strip at once. Moving between days slides the
     whole track sideways: the focused card is sharp and full-size in the
     centre, its neighbours sit dimmed, blurred and scaled-down at the edges
     so the next/previous card is always visibly waiting, not just implied
     by a dot. */
  .carousel-viewport {
    position: relative; overflow: hidden; width: 100%;
    padding: 10px 0 28px;
  }
  .carousel-track {
    display: flex; align-items: center; gap: 22px;
    transition: transform .65s cubic-bezier(.16,1,.3,1);
    will-change: transform;
  }
  .carousel-slot {
    flex: 0 0 auto; width: min(78vw, 340px); transform-origin: center center;
    transition: opacity .55s ease, filter .55s ease, transform .55s cubic-bezier(.16,1,.3,1);
  }
  .carousel-slot[data-dist="0"] { opacity: 1; filter: none; transform: scale(1); z-index: 3; }
  .carousel-slot[data-dist="1"] { opacity: .35; filter: blur(3px) brightness(.5) saturate(.75); transform: scale(.8); z-index: 2; cursor: pointer; }
  .carousel-slot[data-dist="2"] { opacity: .12; filter: blur(6px) brightness(.3); transform: scale(.66); z-index: 1; pointer-events: none; }
  .carousel-slot[data-dist="far"] { opacity: 0; filter: blur(8px); transform: scale(.6); pointer-events: none; }

  .chevron {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 10;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(8,9,15,.55); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: var(--ink); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .2s ease;
  }
  .chevron.chevron-left { left: 0px; }
  .chevron.chevron-right { right: 0px; }
  .chevron:hover:not(:disabled) { background: rgba(255,255,255,.16); }
  .chevron.chevron-left:hover:not(:disabled) { transform: translateY(-50%) translateX(-2px) scale(1.08); }
  .chevron.chevron-right:hover:not(:disabled) { transform: translateY(-50%) translateX(2px) scale(1.08); }
  .chevron:active:not(:disabled) { transform: translateY(-50%) scale(.9); }
  .chevron:disabled { opacity: .12; cursor: default; }
  .chevron svg { width: 16px; height: 16px; }

  /* ============ THE CARD ============ */
  .card-3d {
    width: 100%; aspect-ratio: 5 / 7; position: relative;
    transform-style: preserve-3d; transition: transform .12s ease-out;
    cursor: grab; touch-action: pan-y;
  }
  .card-3d.settling { transition: transform .5s cubic-bezier(.16,1,.3,1); }
  .card-3d.entering { animation: dealIn .6s cubic-bezier(.16,1,.3,1); }
  @keyframes dealIn { from { opacity: 0; transform: translateY(30px) rotateY(-14deg) scale(.94); } to { opacity: 1; transform: translateY(0) rotateY(0) scale(1); } }

  .card-face {
    position: absolute; inset: 0; border-radius: 20px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06) inset;
    background: linear-gradient(165deg, #1c2036 0%, #10121d 55%, #0a0b13 100%);
  }
  /* rarity border rings */
  .card-face::before {
    content: ""; position: absolute; inset: 0; border-radius: 20px; padding: 2px;
    background: linear-gradient(135deg, #3a3f5c, #1a1c2b 40%, #3a3f5c 60%, #1a1c2b);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none; z-index: 5;
  }
  .card-face.won::before { background: linear-gradient(135deg, var(--gold), #fff6da 25%, var(--gold) 50%, #fff6da 75%, var(--gold)); background-size: 300% 300%; animation: goldsheen 4s linear infinite; }
  .card-face.lost::before { background: linear-gradient(135deg, #3a3f5c, #22243a); }
  .card-face.pending::before { background: linear-gradient(135deg, var(--pending), #223 30%, var(--pending) 60%, #223); background-size: 300% 300%; animation: goldsheen 5s linear infinite; opacity: .7; }
  @keyframes goldsheen { to { background-position: 300% 0; } }

  /* foil: a metallic gold/black film -- a faint always-drifting ambient
     layer, plus a soft mouse-tracked spotlight that brightens it locally.
     No rainbow: this is a monochrome gold foil, like brushed metal catching light. */
  .foil-gradient {
    background-image: repeating-linear-gradient(108deg,
      rgba(0,0,0,0)          0%,
      rgba(255,215,140,.9)   6%,
      rgba(255,245,214,1)    9%,
      rgba(255,215,140,.9)  12%,
      rgba(0,0,0,0)         20%,
      rgba(0,0,0,0)         38%,
      rgba(120,94,34,.7)    44%,
      rgba(255,215,140,.85) 48%,
      rgba(120,94,34,.7)    52%,
      rgba(0,0,0,0)         60%,
      rgba(0,0,0,0)        100%);
    background-size: 240% 240%;
  }
  .holo-ambient {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    mix-blend-mode: soft-light; opacity: .22;
    animation: holoDrift 16s ease-in-out infinite;
  }
  .card-face.lost .holo-ambient { opacity: .1; filter: grayscale(1); }
  @keyframes holoDrift {
    0%, 100% { background-position: 10% 20%; }
    50% { background-position: 90% 80%; }
  }
  .holo-spot {
    position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
    mix-blend-mode: soft-light; transition: opacity .4s ease;
    background-position: var(--mx, 50%) var(--my, 50%);
    -webkit-mask-image: radial-gradient(circle 150px at var(--mx, 50%) var(--my, 50%), #fff 0%, transparent 72%);
    mask-image: radial-gradient(circle 150px at var(--mx, 50%) var(--my, 50%), #fff 0%, transparent 72%);
  }
  .card-face.won .holo-spot { opacity: .55; }
  .card-face.pending .holo-spot { opacity: .4; }
  .card-face.lost .holo-spot { opacity: .2; filter: grayscale(1); }
  .card-face:hover .holo-spot { opacity: .8; }
  .glare {
    position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(circle 160px at var(--mx,50%) var(--my,50%), rgba(255,255,255,.4), transparent 70%);
    mix-blend-mode: overlay;
  }
  .card-3d:hover .glare { opacity: 1; }

  /* content */
  .card-content { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; padding: 16px 16px 14px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .set-chip {
    font-size: 8.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
    padding: 3px 8px; border-radius: 999px; color: var(--muted);
  }
  .stars { display: flex; gap: 2px; }
  .stars svg { width: 10px; height: 10px; }
  .stars .on { fill: var(--gold); }
  .stars .off { fill: rgba(255,255,255,.14); }

  .card-title { margin-top: 10px; }
  .card-title .date { font-size: 19px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
  .card-title .rel { font-size: 10.5px; color: var(--muted); margin-top: 1px; text-transform: uppercase; letter-spacing: .06em; }

  .medallion-wrap { display: flex; justify-content: center; margin: 10px 0 8px; }
  .medallion { position: relative; width: 92px; height: 92px; }
  .medallion svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .medallion .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .medallion .pct { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .medallion .lbl { font-size: 6.5px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

  .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent); margin: 2px 0 8px; }

  .legs { display: flex; flex-direction: column; gap: 5px; flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
  .legs::-webkit-scrollbar { width: 4px; }
  .legs::-webkit-scrollbar-track { background: transparent; }
  .legs::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }
  .legs::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.3); }
  .leg {
    /* column, not row: .leg-row-top and the (collapsed) .leg-note stack
       vertically. A row direction here would make the hidden note compete
       for horizontal space with the row above it, shrinking it. */
    display: flex; flex-direction: column; align-items: stretch;
    background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06);
    border-radius: 9px; padding: 5px 7px; cursor: pointer; transition: background .15s;
  }
  .leg:hover { background: rgba(255,255,255,.07); }
  .badge-pair { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
  .hex {
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    font-size: 7.5px; font-weight: 800; letter-spacing: .01em;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
    clip-path: polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  }
  .crest {
    width: 22px; height: 22px; object-fit: contain; flex-shrink: 0;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
    border-radius: 6px; padding: 2px;
  }
  .vs { font-size: 7px; color: var(--muted-2); font-weight: 700; }
  .leg-mid { flex: 1; min-width: 0; }
  .leg-time { font-size: 9px; color: var(--muted-2); font-variant-numeric: tabular-nums; }
  .leg-pct { font-size: 11.5px; font-weight: 800; font-variant-numeric: tabular-nums; width: 34px; text-align: right; flex-shrink: 0; }
  .pip-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
    width: 25px; flex-shrink: 0; cursor: help;
  }
  .pip { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .pip.hit { background: var(--gold); box-shadow: 0 0 3px rgba(255,211,107,.7); }
  .card-face.lost .pip.hit { background: var(--muted); box-shadow: none; }
  .leg-icon { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .leg-icon svg { width: 12px; height: 12px; }
  .leg-note {
    font-size: 9.5px; color: var(--muted); line-height: 1.4;
    max-height: 0; overflow: hidden; transition: max-height .25s ease, margin .25s ease; margin-top: 0;
    padding-left: 29px;
  }
  .leg.open .leg-note { max-height: 60px; margin-top: 4px; }
  .leg-row-top { display: flex; align-items: center; gap: 7px; width: 100%; }

  .card-bottom { margin-top: 8px; display: flex; justify-content: space-between; align-items: flex-end; }
  .flavor { font-size: 8px; font-style: italic; color: var(--muted-2); line-height: 1.4; max-width: 62%; }
  .cardnum { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; color: var(--muted-2); text-align: right; }
  .streak-badge {
    display: inline-flex; align-items: center; gap: 5px; font-style: normal;
    font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
    font-size: 9px; color: #fff2d0; white-space: nowrap;
    background: linear-gradient(135deg, rgba(255,179,71,.28), rgba(255,90,20,.16));
    border: 1px solid rgba(255,179,71,.5); padding: 3px 9px 3px 6px; border-radius: 999px;
    animation: streakPulse 2.2s ease-in-out infinite;
  }
  .streak-badge .flame {
    font-size: 11px; display: inline-block; line-height: 1;
    filter: drop-shadow(0 0 3px rgba(255,140,40,.9));
    animation: flameFlicker 1.1s ease-in-out infinite;
  }
  @keyframes flameFlicker {
    0%, 100% { transform: scale(1) rotate(-4deg); }
    50% { transform: scale(1.2) rotate(4deg); }
  }
  @keyframes streakPulse {
    0%, 100% { box-shadow: 0 0 7px rgba(255,140,40,.25); }
    50% { box-shadow: 0 0 16px rgba(255,140,40,.6); }
  }

  /* stamp seal for WON / LOST */
  .seal {
    position: absolute; top: 38%; left: 50%; z-index: 7; pointer-events: none;
    transform: translate(-50%,-50%) rotate(-16deg); font-weight: 800; letter-spacing: .1em;
    padding: 6px 18px; border: 3px solid; border-radius: 8px; font-size: 22px;
    opacity: 0; text-transform: uppercase; white-space: nowrap;
  }
  .seal.show { animation: stampIn .5s cubic-bezier(.16,1,.3,1) .3s forwards; }
  @keyframes stampIn { from { opacity: 0; transform: translate(-50%,-50%) rotate(-16deg) scale(2.4); } to { opacity: .88; transform: translate(-50%,-50%) rotate(-16deg) scale(1); } }
  .seal.won { color: var(--win); border-color: var(--win); box-shadow: 0 0 24px rgba(62,232,156,.35); }
  .seal.lost { color: var(--loss); border-color: var(--loss); box-shadow: 0 0 24px rgba(255,85,119,.3); }

  .live-ribbon {
    position: absolute; top: 14px; right: -34px; z-index: 7; pointer-events: none;
    background: var(--pending); color: #05060a; font-size: 9px; font-weight: 800;
    letter-spacing: .08em; padding: 3px 38px; transform: rotate(35deg);
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }

  /* pagination + actions */
  .dots { display: flex; justify-content: center; gap: 6px; margin: 16px 0 4px; flex-wrap: wrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.16); cursor: pointer; transition: all .25s; }
  .dot.active { background: var(--ink); width: 16px; border-radius: 3px; }

  .empty { text-align: center; color: var(--muted-2); padding: 60px 20px; font-size: 13px; }

  /* ============ MARKET TOGGLE: a draggable, elastic football ============
     Two zones ("Over 1.5" / "Double Chance"), a football you can fling
     between them. Dragging stretches an elastic band behind the ball and
     squashes the ball along the drag axis; letting go runs a real
     spring-damper simulation (not a canned CSS easing curve) so it
     overshoots and settles like something with actual momentum, and the
     ball visibly rolls (rotates) as it travels, not just slides.
     Toggling this is not decorative -- it filters which market's cards
     the carousel below is showing. */
  .mkt-toggle-wrap { display: flex; justify-content: center; margin-bottom: 22px; }
  .mkt-toggle {
    position: relative; width: min(88vw, 340px); height: 58px;
    touch-action: none; /* we own all drag gestures here, no browser scroll-stealing */
  }
  .mkt-track {
    position: absolute; inset: 0; border-radius: 999px;
    background: linear-gradient(180deg, #12131e, #0a0b12);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: inset 0 2px 10px rgba(0,0,0,.6), inset 0 -1px 0 rgba(255,255,255,.04);
    overflow: hidden;
  }
  .mkt-fill {
    position: absolute; top: 0; bottom: 0; left: 0; width: 50%;
    background: linear-gradient(90deg, var(--mkt-color, var(--pending)), transparent);
    opacity: .35; filter: blur(2px);
    transition: opacity .25s ease;
  }
  .mkt-label {
    position: absolute; top: 0; bottom: 0; display: flex; align-items: center;
    font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted-2); transition: color .3s ease, text-shadow .3s ease;
    z-index: 2; white-space: nowrap; cursor: pointer;
  }
  .mkt-label-left { left: 18px; }
  .mkt-label-right { right: 18px; }
  .mkt-label.active { color: var(--ink); text-shadow: 0 0 14px var(--mkt-glow, rgba(122,184,255,.7)); }

  .mkt-ball {
    position: absolute; top: 50%; left: 0; width: 46px; height: 46px;
    margin-top: -23px; z-index: 3; cursor: grab;
    transition: transform .05s linear; /* only smooths sub-frame jitter; drag & spring drive the real motion */
  }
  .mkt-ball.dragging { cursor: grabbing; }
  .mkt-ball-face {
    width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(235,235,240,.9) 35%, rgba(200,202,210,.95) 70%, rgba(160,162,172,1) 100%);
    box-shadow:
      0 6px 14px rgba(0,0,0,.5),
      0 2px 4px rgba(0,0,0,.4),
      inset 0 -4px 8px rgba(0,0,0,.25),
      inset 0 3px 5px rgba(255,255,255,.6);
  }
  .mkt-ball .pentagon {
    position: absolute; background: #191a22;
    clip-path: polygon(50% 0%, 95% 35%, 78% 90%, 22% 90%, 5% 35%);
  }
  .mkt-ball .p1 { width: 15px; height: 15px; top: 6px; left: 15.5px; }
  .mkt-ball .p2 { width: 12px; height: 12px; top: 24px; left: 3px; transform: rotate(-18deg); }
  .mkt-ball .p3 { width: 12px; height: 12px; top: 24px; left: 28px; transform: rotate(18deg); }
  .mkt-ball .p4 { width: 9px; height: 9px; top: 36px; left: 18px; opacity: .9; }
  .mkt-ball-seam {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      repeating-conic-gradient(from 0deg, rgba(20,20,26,.12) 0deg 2deg, transparent 2deg 24deg);
    mix-blend-mode: multiply;
  }
  .mkt-ball-shine {
    position: absolute; top: 8%; left: 14%; width: 34%; height: 26%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,255,255,0) 70%);
    pointer-events: none;
  }

  .mkt-band {
    position: absolute; top: 50%; height: 3px; z-index: 1; pointer-events: none;
    background: linear-gradient(90deg, var(--mkt-color, var(--pending)), rgba(255,255,255,.5));
    transform-origin: left center; opacity: 0; border-radius: 3px;
    box-shadow: 0 0 8px var(--mkt-glow, rgba(122,184,255,.6));
  }
  .mkt-band.show { opacity: .8; }

  .mkt-toggle.market-over15 { --mkt-color: var(--pending); --mkt-glow: rgba(122,184,255,.7); }
  .mkt-toggle.market-dc12 { --mkt-color: var(--gold); --mkt-glow: rgba(255,211,107,.7); }

  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="wrap">
  <div class="mkt-toggle-wrap">
    <div class="mkt-toggle market-over15" id="mktToggle">
      <div class="mkt-track">
        <div class="mkt-fill" id="mktFill"></div>
        <div class="mkt-label mkt-label-left" id="mktLabelLeft">Over 1.5</div>
        <div class="mkt-label mkt-label-right" id="mktLabelRight">Double Chance</div>
      </div>
      <div class="mkt-band" id="mktBand"></div>
      <div class="mkt-ball" id="mktBall">
        <div class="mkt-ball-face">
          <div class="mkt-ball-seam"></div>
          <div class="pentagon p1"></div>
          <div class="pentagon p2"></div>
          <div class="pentagon p3"></div>
          <div class="pentagon p4"></div>
          <div class="mkt-ball-shine"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="carouselRoot"></div>

  const d = new Date(dateStr + 'T00:00:00Z').getTime();
  const today = new Date(todayWAT() + 'T00:00:00Z').getTime();
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === -1) return 'Yesterday';
  if (diff === 1) return 'Tomorrow';
  return diff < 0 ? `${-diff} days ago` : `in ${diff} days`;
}
// Focus today's card by default. Dates are sorted ascending (past -> left,
// future -> right), so "today" is rarely index 0 once both past and future
// cards exist. If today itself has no card logged, focus whichever logged
// date is closest to it rather than falling back to an arbitrary end.
// `dates` holds composite (date, market) ids now, e.g. "2026-09-10::over15" --
// look up each one's real calendar date via DATA.days[id].date rather than
// treating the id itself as a date string. When today has more than one
// market's card, the first match wins, which is exactly the fixed
// over15-before-dc12 (etc.) order cmd_render already sorted them into.
function initialIdx(dates) {
  const today = todayWAT();
  const exact = dates.findIndex(id => DATA.days[id].date === today);
  if (exact !== -1) return exact;
  const todayMs = new Date(today + 'T00:00:00Z').getTime();
  let best = 0, bestDiff = Infinity;
  dates.forEach((id, i) => {
    const diff = Math.abs(new Date(DATA.days[id].date + 'T00:00:00Z').getTime() - todayMs);
    if (diff < bestDiff) { bestDiff = diff; best = i; }
  });
  return best;
}
function starRow(avgP) {
  let n = 1;
  if (avgP >= 88) n = 5; else if (avgP >= 84) n = 4; else if (avgP >= 80) n = 3; else if (avgP >= 75) n = 2;
  let out = '';
  for (let i = 0; i < 5; i++) {
    out += `<svg viewBox="0 0 24 24" class="${i < n ? 'on' : 'off'}"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>`;
  }
  return out;
}
const ICONS = {
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
  cross: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
  left: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  right: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`,
};

function ringSvg(pct, color) {
  const r = 40, c = 2 * Math.PI * r;
  const off = c - (pct/100) * c;
  return `<svg viewBox="0 0 92 92">
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7"/>
    <circle class="ring-fg" cx="46" cy="46" r="${r}" fill="none" stroke="${color}" stroke-width="7"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"
      style="transition: stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1);"/>
  </svg>`;
}

function buildCard(date, day) {
  const legs = day.legs, meta = day.meta || {};
  const allSettled = legs.every(l => l.status !== 'pending');
  const wins = legs.filter(l => l.status === 'WON').length;
  const rarity = allSettled ? (wins === legs.length ? 'won' : 'lost') : 'pending';
  const avgP = legs.reduce((a,l) => a + l.own_p, 0) / legs.length;
  const combined = meta.combined_chance != null ? meta.combined_chance : legs.reduce((a,l)=>a*(l.own_p/100),1)*100;
  const ringColor = rarity === 'won' ? 'var(--win)' : rarity === 'lost' ? 'var(--loss)' : 'var(--pending)';

  const legRows = legs.map((l, i) => {
    const parts = l.match.split(/\s+v\s+/i);
    const home = parts[0] || l.match, away = parts[1] || '';
    const icon = l.status === 'WON' ? ICONS.check : l.status === 'LOST' ? ICONS.cross : ICONS.clock;
    const iconColor = l.status === 'WON' ? 'var(--win)' : l.status === 'LOST' ? 'var(--loss)' : 'var(--muted-2)';
    const scoreText = l.actual_score ? l.actual_score : l.kickoff_local.split(' ')[1] || '';
    return `
    <div class="leg" data-i="${i}">
      <div class="leg-row-top">
        <div class="badge-pair">
          ${crestHtml(l.home_id, home)}
          <span class="vs">v</span>
          ${crestHtml(l.away_id, away)}
        </div>
        <div class="leg-mid"><div class="leg-time">${scoreText}</div></div>
        <div class="leg-pct">${l.own_p}%</div>
        ${pipGridHtml(l.sample_o15, l.sample_label || 'o1.5')}
        <div class="leg-icon" style="color:${iconColor}">${icon}</div>
      </div>
      ${l.note ? `<div class="leg-note">${l.note}</div>` : ''}
    </div>`;
  }).join('');

  const seal = rarity === 'won' ? `<div class="seal won show">WON</div>` : rarity === 'lost' ? `<div class="seal lost show">LOST</div>` : '';
  const ribbon = rarity === 'pending' ? `<div class="live-ribbon">IN PLAY</div>` : '';

  return `
  <div class="card-3d settling">
    <div class="card-face ${rarity}">
      <div class="holo-ambient foil-gradient"></div>
      <div class="holo-spot foil-gradient"></div>
      <div class="glare"></div>
      ${seal}
      ${ribbon}
      <div class="card-content">
        <div class="card-top">
          <span class="set-chip">${meta.market_label || 'Over 1.5'} &middot; ${legs.length} legs</span>
          <div class="stars">${starRow(avgP)}</div>
        </div>
        <div class="card-title">
          <div class="date">${date}</div>
          <div class="rel">${relDay(date)}</div>
        </div>
        <div class="medallion-wrap">
          <div class="medallion">
            ${ringSvg(combined, ringColor)}
            <div class="center"><div class="pct">${fmtPct(combined).replace('.0%','%')}</div><div class="lbl">Accumulator</div></div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="legs">${legRows}</div>
        <div class="card-bottom">
          <div class="flavor">${(DATA.summary.current_streak >= 2 && rarity !== 'lost') ? `<span class="streak-badge"><span class="flame">&#128293;</span>${DATA.summary.current_streak}-CARD STREAK</span>` : 'Forged from head-to-head, form &amp; goals alone.'}</div>
          <div class="cardnum">${meta.booking_code ? ('#' + meta.booking_code + (meta.share_url ? ' <span style="opacity:.55">&#8599;</span>' : '')) : ''}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function attachCardInteractions(slot, day) {
  const card3d = slot.querySelector('.card-3d');
  const face = slot.querySelector('.card-face');
  if (!card3d || !face) return;

  function setTilt(x, y, rect) {
    const px = (x - rect.left) / rect.width, py = (y - rect.top) / rect.height;
    const rx = (py - .5) * -14, ry = (px - .5) * 14;
    card3d.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    face.style.setProperty('--mx', (px*100) + '%');
    face.style.setProperty('--my', (py*100) + '%');
  }
  card3d.addEventListener('mousemove', e => {
    if (slot.dataset.dist !== '0') return; // only the focused card tilts; neighbours are static previews
    card3d.classList.remove('settling');
    setTilt(e.clientX, e.clientY, card3d.getBoundingClientRect());
  });
  card3d.addEventListener('mouseleave', () => {
    card3d.classList.add('settling');
    card3d.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
  });

  slot.querySelectorAll('.leg').forEach(el => {
    el.addEventListener('click', (e) => {
      if (slot.dataset.dist !== '0') return; // a tap on a neighbour jumps focus instead (see renderCarousel)
      e.stopPropagation(); // a leg tap toggles its own note -- it must not also fire the card-wide SportyBet-open tap below
      el.classList.toggle('open');
    });
  });

  // Tapping the focused card anywhere outside a leg row opens the booking
  // code's SportyBet betslip in a new tab -- 'a card is the pick', so the
  // whole face is the tap target, not a small link buried in a corner.
  const shareUrl = day.meta && day.meta.share_url;
  if (shareUrl) {
    card3d.addEventListener('click', () => {
      if (slot.dataset.dist !== '0') return; // only the focused card is tappable; a neighbour tap jumps focus instead (handled above, capture phase)
      window.open(shareUrl, '_blank', 'noopener');
    });
  }

  const isWon = face.classList.contains('won');
  if (isWon && !day._confettiFired) {
    day._confettiFired = true;
    setTimeout(fireConfetti, 500);
  }
}

// getBoundingClientRect() reports the *visually rendered* box, which
// includes the CSS transform: scale(...) every non-focused slot carries for
// the dim/blur peek effect. Reading it off whichever slot happens to sit at
// children[0] silently shrinks this measurement the moment you're no longer
// on the very first card, corrupting every offset after that. getComputedStyle
// reports the layout width transforms don't touch, so use that instead --
// and read it off the currently-FOCUSED slot specifically, not an arbitrary one.
function slotLayoutWidth(slot) {
  return parseFloat(getComputedStyle(slot).width) || 0;
}

function trackStep() {
  const track = document.getElementById('track');
  const gap = parseFloat(getComputedStyle(track).columnGap) || 22;
  return slotLayoutWidth(track.children[0]) + gap;
}

function positionTrack(instant) {
  const viewport = document.getElementById('viewport');
  const track = document.getElementById('track');
  const slots = [...track.children];
  if (!slots.length) return;
  const step = trackStep();
  const slotWidth = slotLayoutWidth(slots[idx] || slots[0]);
  const viewportWidth = parseFloat(getComputedStyle(viewport).width) || viewport.getBoundingClientRect().width;
  const offset = (viewportWidth - slotWidth) / 2 - idx * step;

  if (instant) track.style.transition = 'none';
  track.style.transform = `translateX(${offset}px)`;
  if (instant) { void track.offsetHeight; track.style.transition = ''; }

  slots.forEach((slot, i) => {
    const d = Math.abs(i - idx);
    slot.dataset.dist = d <= 2 ? String(d) : 'far';
  });

  // slots.length is the count of what's actually rendered right now (i.e.
  // already filtered to the active market) -- DATA.dates is the *full*
  // unfiltered list across every market, and using it here would leave
  // rightBtn wrongly enabled past the true last card whenever the active
  // market has fewer cards than the grand total.
  const leftBtn = document.getElementById('leftBtn'), rightBtn = document.getElementById('rightBtn');
  if (leftBtn) leftBtn.disabled = idx <= 0;
  if (rightBtn) rightBtn.disabled = idx >= slots.length - 1;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));

  if (!instant) {
    // ring fills on the newly-focused card animate in as it settles into place
    const focusedSlot = slots[idx];
    requestAnimationFrame(() => {
      focusedSlot.querySelectorAll('.ring-fg').forEach(c => {
        const off = c.getAttribute('data-off');
        c.style.strokeDashoffset = off;
      });
    });
  }
}

function goTo(newIdx) {
  // bound against what's actually in the DOM (the active-market-filtered
  // set), not DATA.dates -- same reasoning as positionTrack() above.
  const total = document.getElementById('track')?.children.length || 0;
  if (newIdx < 0 || newIdx >= total || newIdx === idx) return;
  idx = newIdx;
  positionTrack(false);
}

let firstRender = true;

function renderCarousel(preferDate) {
  const dates = DATA.dates.filter(id => DATA.days[id].market === activeMarket);
  const root = document.getElementById('carouselRoot');
  if (!dates.length) {
    const label = activeMarket === 'dc12' ? 'Double Chance' : 'Over 1.5';
    root.innerHTML = `<div class="empty">No ${label} cards logged yet.<br>Build one, then run <code>track.py record</code>.</div>`;
    return;
  }
  // switching markets tries to land on the same calendar date you were
  // already looking at (e.g. today's Over 1.5 card -> today's Double Chance
  // card), falling back to the usual today-or-closest logic if that date
  // has no card in the market you just switched to.
  const preferred = preferDate ? dates.findIndex(id => DATA.days[id].date === preferDate) : -1;
  idx = preferred !== -1 ? preferred : initialIdx(dates);

  root.innerHTML = `
    <div class="carousel-viewport" id="viewport">
      <div class="carousel-track" id="track">
        ${dates.map((id, i) => `<div class="carousel-slot" data-i="${i}">${buildCard(DATA.days[id].date, DATA.days[id])}</div>`).join('')}
      </div>
      <button class="chevron chevron-left" id="leftBtn">${ICONS.left}</button>
      <button class="chevron chevron-right" id="rightBtn">${ICONS.right}</button>
    </div>
    <div class="dots">${dates.map((d, i) => `<div class="dot" data-i="${i}"></div>`).join('')}</div>`;

  const track = document.getElementById('track');
  [...track.children].forEach((slot, i) => {
    const day = DATA.days[dates[i]];
    attachCardInteractions(slot, day);
    // tapping a dimmed neighbour brings it into focus instead of letting its
    // (currently inert) inner controls fire
    slot.addEventListener('click', (e) => {
      if (i !== idx) {
        // stop here: this click is "bring this card into focus", full stop --
        // don't also let it fall through to a leg's own open/close toggle
        // underneath the tap, which would fire once dist flips to '0' below.
        e.stopPropagation();
        goTo(i);
      }
    }, true);
  });

  document.getElementById('leftBtn').onclick = () => goTo(idx - 1);
  document.getElementById('rightBtn').onclick = () => goTo(idx + 1);
  document.querySelectorAll('.dot').forEach(d => {
    d.onclick = () => goTo(parseInt(d.dataset.i, 10));
  });

  positionTrack(true);
  // Guessing "layout has probably settled by now" with rAF/load timeouts is
  // fragile -- a scrollbar appearing once 5 cards' crest images finish
  // loading, or a late web-font swap, changes the viewport's real width
  // *after* that first measurement, and the focused card ends up centered
  // against a width that's no longer true. A ResizeObserver reports the
  // viewport's actual size whenever it actually changes, including the very
  // first layout pass, so re-run the same instant recentre every time --
  // it's cheap and idempotent, and it's the correct tool for this rather
  // than another timing guess.
  const viewportEl = document.getElementById('viewport');
  if (window.ResizeObserver) {
    if (window.__carouselRO) window.__carouselRO.disconnect();
    window.__carouselRO = new ResizeObserver(() => positionTrack(true));
    window.__carouselRO.observe(viewportEl);
  }

  // one-time "dealt onto the table" flourish for the very first card shown
  if (firstRender) {
    firstRender = false;
    const focusedCard = track.children[idx]?.querySelector('.card-3d');
    if (focusedCard) {
      focusedCard.classList.add('entering');
      focusedCard.addEventListener('animationend', () => focusedCard.classList.remove('entering'), { once: true });
    }
  }
  track.querySelectorAll('.ring-fg').forEach(c => {
    const off = c.getAttribute('data-off');
    requestAnimationFrame(() => { c.style.strokeDashoffset = off; });
  });
}

function fireConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const colors = ['#ffd36b', '#3ee89c', '#7ab8ff', '#ff5577', '#ffffff'];
  const originX = canvas.width/2, originY = canvas.height*0.35;
  const pieces = Array.from({length: 70}, () => {
    const angle = Math.random()*Math.PI*2, speed = 2 + Math.random()*6;
    return { x: originX, y: originY, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 2,
      size: 3 + Math.random()*4, rot: Math.random()*360, vr: (Math.random()-.5)*12,
      color: colors[Math.floor(Math.random()*colors.length)] };
  });
  let frame = 0;
  function loop() {
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    for (const p of pieces) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.rot += p.vr;
      if (frame < 200) alive = true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, 1 - frame/200);
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
      ctx.restore();
    }
    if (alive) requestAnimationFrame(loop); else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  loop();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') goTo(idx - 1);
  if (e.key === 'ArrowRight') goTo(idx + 1);
});
let tsx = null, tsy = null;
document.body.addEventListener('touchstart', e => { tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; });
document.body.addEventListener('touchend', e => {
  if (tsx == null) return;
  const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) goTo(idx + 1); else goTo(idx - 1);
  }
  tsx = null; tsy = null;
});
window.addEventListener('resize', () => {
  const c = document.getElementById('confetti-canvas'); c.width = innerWidth; c.height = innerHeight;
  positionTrack(true);
});
window.addEventListener('load', () => positionTrack(true));

// ============ MARKET TOGGLE: draggable elastic football ============
function setupMarketToggle() {
  const marketsPresent = new Set(DATA.dates.map(id => DATA.days[id].market));
  const wrap = document.querySelector('.mkt-toggle-wrap');
  if (!marketsPresent.has('dc12')) {
    // nothing to switch to yet -- hide the widget rather than show a
    // control with only one real destination
    if (wrap) wrap.style.display = 'none';
    return;
  }

  const toggle = document.getElementById('mktToggle');
  const trackEl = toggle.querySelector('.mkt-track');
  const ball = document.getElementById('mktBall');
  const face = ball.querySelector('.mkt-ball-face');
  const seam = ball.querySelector('.mkt-ball-seam');
  const fill = document.getElementById('mktFill');
  const band = document.getElementById('mktBand');
  const labelLeft = document.getElementById('mktLabelLeft');
  const labelRight = document.getElementById('mktLabelRight');

  const BALL_D = 46, PAD = 4, OVERTRAVEL = 16;
  let leftX = PAD, rightX = 140;
  let x = leftX, vx = 0, dragging = false, dragStartClientX = 0, dragStartBallX = 0;
  let rafId = null, rollDeg = 0;

  function bounds() {
    rightX = trackEl.getBoundingClientRect().width - BALL_D - PAD;
  }

  function paint() {
    ball.style.transform = `translateX(${x}px)`;
    const stretch = Math.max(-0.3, Math.min(0.3, vx / 36));
    face.style.transform = `scale(${1 + stretch}, ${1 - stretch})`;
    const span = Math.max(1, rightX - leftX);
    const frac = Math.max(0, Math.min(1, (x - leftX) / span));
    fill.style.width = (12 + frac * 76) + '%';
    fill.style.opacity = String(0.22 + frac * 0.28);
    labelLeft.classList.toggle('active', frac < 0.5);
    labelRight.classList.toggle('active', frac >= 0.5);
    rollDeg += vx * 2.6;
    seam.style.transform = `rotate(${rollDeg}deg)`;
    band.style.width = (x + BALL_D / 2) + 'px';
  }

  function setActiveMarket(m) {
    if (activeMarket === m) return;
    const currentDates = DATA.dates.filter(id => DATA.days[id].market === activeMarket);
    const preferDate = currentDates[idx] ? DATA.days[currentDates[idx]].date : null;
    activeMarket = m;
    toggle.classList.toggle('market-over15', m === 'over15');
    toggle.classList.toggle('market-dc12', m === 'dc12');
    firstRender = true; // replay the "dealt onto the table" entrance on every switch
    renderCarousel(preferDate);
  }

  function springTo(target) {
    cancelAnimationFrame(rafId);
    const k = 0.32, damping = 0.80;
    function step() {
      vx = (vx + (target - x) * k) * damping;
      x += vx;
      paint();
      if (Math.abs(vx) > 0.4 || Math.abs(target - x) > 0.4) {
        rafId = requestAnimationFrame(step);
      } else {
        x = target; vx = 0;
        paint();
        band.classList.remove('show');
      }
    }
    rafId = requestAnimationFrame(step);
  }

  function settle() {
    bounds();
    const landedRight = x > (leftX + rightX) / 2;
    setActiveMarket(landedRight ? 'dc12' : 'over15');
    springTo(landedRight ? rightX : leftX);
  }

  ball.addEventListener('pointerdown', (e) => {
    bounds();
    dragging = true;
    ball.classList.add('dragging');
    if (ball.setPointerCapture) ball.setPointerCapture(e.pointerId);
    dragStartClientX = e.clientX;
    dragStartBallX = x;
    cancelAnimationFrame(rafId);
    band.classList.add('show');
  });
  ball.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const prevX = x;
    x = Math.max(leftX - OVERTRAVEL, Math.min(rightX + OVERTRAVEL, dragStartBallX + (e.clientX - dragStartClientX)));
    vx = x - prevX;
    paint();
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    ball.classList.remove('dragging');
    settle();
  }
  ball.addEventListener('pointerup', endDrag);
  ball.addEventListener('pointercancel', endDrag);

  labelLeft.addEventListener('click', () => { bounds(); setActiveMarket('over15'); springTo(leftX); });
  labelRight.addEventListener('click', () => { bounds(); setActiveMarket('dc12'); springTo(rightX); });

  bounds();
  x = leftX;
  paint();
  window.addEventListener('resize', bounds);
}

setupMarketToggle();
renderCarousel();
</script>
</body>
</html>
